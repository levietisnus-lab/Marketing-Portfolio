    <text x="145" y="475" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Brief UI/UX &amp; User Flow</text>
    <text x="145" y="495" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Trải nghiệm 1 chạm trên Zalo</text>
