    <text x="216" y="184" fill="#051b14" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Đổi Quà</text>

    <!-- Mini App Feature Grid (Brief UI Wireframe) -->
    <rect x="20" y="232" width="118" height="92" rx="14" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.3)" />
    <text x="79" y="274" fill="#67e8f9" font-family="Outfit, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Quét QR</text>
    <text x="79" y="296" fill="#cbd5e1" font-family="Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Tích điểm ngay</text>

    <rect x="152" y="232" width="118" height="92" rx="14" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.3)" />
    <text x="211" y="274" fill="#d8b4fe" font-family="Outfit, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Đặt Nước</text>
    <text x="211" y="296" fill="#cbd5e1" font-family="Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Giao nhanh 2h</text>

    <rect x="20" y="338" width="118" height="92" rx="14" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" />
    <text x="79" y="380" fill="#6ee7b7" font-family="Outfit, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Kho Voucher</text>
    <text x="79" y="402" fill="#cbd5e1" font-family="Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Ưu đãi cá nhân</text>

    <rect x="152" y="338" width="118" height="92" rx="14" fill="rgba(236, 72, 153, 0.1)" stroke="rgba(236, 72, 153, 0.3)" />
    <text x="211" y="380" fill="#f9a8d4" font-family="Outfit, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Tìm Đại Lý</text>
    <text x="211" y="402" fill="#cbd5e1" font-family="Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Định vị gần nhất</text>

    <!-- Bottom UI Brief Caption -->
