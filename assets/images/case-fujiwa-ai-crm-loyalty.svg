      <!-- Arrow 1 -->
      <path d="M 146 52 L 160 52" stroke="#00f2fe" stroke-width="2" />

      <rect x="162" y="0" width="142" height="105" rx="14" fill="rgba(0, 242, 254, 0.13)" stroke="#00f2fe" stroke-width="1.2" />
