      <text x="90" y="26" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. Quét QR trên Chai/Thùng</text>
      <text x="90" y="46" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Điểm bán, Sự kiện, Bao bì</text>

      <rect y="78" width="180" height="62" rx="12" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.28)" />
      <text x="90" y="104" fill="#67e8f9" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. Định Danh Trên Mini App</text>
      <text x="90" y="124" fill="#e2e8f0" font-family="Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Thu thập Tên, SĐT, Khu vực</text>

