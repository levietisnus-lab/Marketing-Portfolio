  <text x="220" y="65" fill="#00f2fe" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1.5">FUJIWA VIETNAM · AI &amp; CRM ECOSYSTEM</text>

  <text x="60" y="122" fill="#ffffff" font-family="Outfit, sans-serif" font-size="34" font-weight="800">Easy AI Chatbot · Automation · Zalo Mini App · QR Data</text>

  <!-- ==================== 1. EASY AI OMNICHANNEL CHATBOT (TOP LEFT) ==================== -->
  <g transform="translate(60, 160)">
    <rect width="510" height="245" rx="20" fill="url(#cardSurface)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1.5" />
    <rect x="24" y="22" width="46" height="46" rx="12" fill="url(#cyanBlue)" />
    <text x="47" y="52" fill="#06101e" font-family="Outfit, sans-serif" font-size="20" font-weight="900" text-anchor="middle">AI</text>
    <text x="86" y="42" fill="#ffffff" font-family="Outfit, sans-serif" font-size="20" font-weight="700">Easy AI Omnichannel Chatbot</text>
    <text x="86" y="64" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="500">Tích hợp đồng bộ nền tảng bán hàng &amp; Mạng xã hội 24/7</text>

    <!-- Channel Pills -->
    <g transform="translate(24, 90)">
      <rect x="0" y="0" width="105" height="34" rx="10" fill="rgba(59, 130, 246, 0.18)" stroke="#3b82f6" stroke-width="1" />
      <text x="52.5" y="22" fill="#93c5fd" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Meta Pages</text>

      <rect x="118" y="0" width="105" height="34" rx="10" fill="rgba(0, 242, 254, 0.16)" stroke="#00f2fe" stroke-width="1" />
      <text x="170.5" y="22" fill="#67e8f9" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Zalo OA</text>

      <rect x="236" y="0" width="105" height="34" rx="10" fill="rgba(236, 72, 153, 0.16)" stroke="#ec4899" stroke-width="1" />
      <text x="288.5" y="22" fill="#f9a8d4" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">TikTok / E-com</text>

      <rect x="354" y="0" width="108" height="34" rx="10" fill="rgba(16, 185, 129, 0.16)" stroke="#10b981" stroke-width="1" />
      <text x="408" y="22" fill="#6ee7b7" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Website Live</text>
    </g>

    <!-- Chat Flow Preview -->
    <rect x="24" y="142" width="462" height="80" rx="12" fill="rgba(7, 11, 25, 0.65)" stroke="rgba(255,255,255,0.08)" />
    <circle cx="48" cy="168" r="8" fill="#10b981" />
    <text x="66" y="173" fill="#e2e8f0" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600">Tư vấn tự động 24/7 · Phân luồng Lead B2B Đại lý &amp; Khách lẻ B2C</text>
    <text x="66" y="198" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700">✓ Đồng bộ kịch bản sản phẩm Fujiwa &amp; đẩy dữ liệu trực tiếp về CRM</text>
  </g>

