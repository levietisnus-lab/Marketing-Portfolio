    <rect x="50" y="107" width="38" height="38" rx="6" fill="#070b19" />
    <rect x="58" y="115" width="22" height="22" rx="3" fill="#00f2fe" />
    <rect x="132" y="107" width="38" height="38" rx="6" fill="#070b19" />
    <rect x="140" y="115" width="22" height="22" rx="3" fill="#00f2fe" />
    <rect x="50" y="189" width="38" height="38" rx="6" fill="#070b19" />
    <rect x="58" y="197" width="22" height="22" rx="3" fill="#10b981" />
    <rect x="100" y="107" width="18" height="18" fill="#070b19" />
    <rect x="100" y="138" width="22" height="22" fill="#a855f7" />
    <rect x="50" y="156" width="38" height="18" fill="#070b19" />
    <rect x="132" y="156" width="38" height="32" fill="#070b19" />
    <rect x="102" y="172" width="20" height="55" fill="#070b19" />
    <rect x="132" y="202" width="38" height="25" fill="#10b981" />

