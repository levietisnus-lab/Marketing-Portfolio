    <text x="86" y="42" fill="#ffffff" font-family="Outfit, sans-serif" font-size="20" font-weight="700">Customer Care · Remarketing · Loyalty</text>
    <text x="86" y="64" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="500">Chuỗi Workflow tự động hóa nuôi dưỡng &amp; giữ chân khách hàng</text>

    <!-- 3 Step Flow Nodes -->
    <g transform="translate(24, 94)">
