      <text x="233" y="75" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">theo chu kỳ tiêu dùng</text>

      <!-- Arrow 2 -->
      <path d="M 308 52 L 322 52" stroke="#10b981" stroke-width="2" />

      <rect x="324" y="0" width="138" height="105" rx="14" fill="rgba(16, 185, 129, 0.14)" stroke="#10b981" stroke-width="1.2" />
      <text x="393" y="30" fill="#6ee7b7" font-family="Outfit, sans-serif" font-size="14" font-weight="800" text-anchor="middle">03. LOYALTY</text>
      <text x="393" y="55" fill="#e2e8f0" font-family="Plus Jakarta Sans, sans-serif" font-size="12" text-anchor="middle">Tích điểm đổi quà</text>
      <text x="393" y="75" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">&amp; Hạng thành viên VIP</text>
